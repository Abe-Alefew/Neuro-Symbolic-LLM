services:
  app:
    build: .
    image: neuro-symbolic-llm:latest
    container_name: neuro-symbolic-llm-runner
    working_dir: /app
    volumes:
      - .:/app
      - nsllm-hf-cache:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
    command: bash

  test:
    build: .
    image: neuro-symbolic-llm:latest
    working_dir: /app
    volumes:
      - .:/app
      - nsllm-hf-cache:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
    command: pytest

volumes:
  nsllm-hf-cache:
    name: nsllm-hf-cache
