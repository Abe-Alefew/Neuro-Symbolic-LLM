# Runs on every push to main/dev and every pull request to main.
# Both checks must pass before a PR can be merged.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:

  # ── Code quality checks ──────────────────────────────────────────────
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run all pre-commit hooks
        run: pre-commit run --all-files
        # This runs black, ruff, mypy, and all file hygiene checks.
        # If any fail, the job fails and the PR cannot be merged.

  # ── Tests ────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: pip install -e ".[dev]"
        # Installs the project in editable mode with dev dependencies.
        # Does NOT install hyperon or GPU JAX — CI runs CPU only.

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        # -v: verbose output, shows each test name
        # --tb=short: shorter traceback on failures

      - name: Run grammar integration tests
        run: pytest tests/unit/test_atomese.py -v
        # These do not need any running services.
        # Integration tests that need MORK/parser are skipped in CI
        # (they require running services which CI does not have).
